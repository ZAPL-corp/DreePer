name: build-windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Dreeper (portable exe + NSIS installer)
        run: npx --yes @tauri-apps/cli@2 build
        working-directory: .

      - name: Pack portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/dreeper.exe dist/Dreeper.exe
          Copy-Item README.md dist/README.md -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath Dreeper-windows-x64-portable.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dreeper-windows-x64
          path: |
            Dreeper-windows-x64-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Dreeper-windows-x64-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

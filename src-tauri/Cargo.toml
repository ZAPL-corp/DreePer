[package]
name = "dreeper"
version = "0.1.0"
edition = "2021"
description = "Dreeper — музыкальный плеер с текстами песен"
authors = ["Dreeper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
walkdir = "2"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
